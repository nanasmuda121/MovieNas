<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Detail Film / Series — MovieNas</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍿</text></svg>" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>

  <!-- Top Navbar -->
  <header class="navbar">
    <div class="nav-left">
      <a href="/" class="brand-logo">
        <div class="logo-icon">
          <i class="fa-solid fa-play"></i>
        </div>
        <span>Movie<span class="logo-tag">Nas</span></span>
      </a>

      <ul class="nav-links" id="navLinks">
        <li><a href="/" class="nav-link"><i class="fa-solid fa-house"></i> Beranda</a></li>
        <li><a href="/search.html?type=1" class="nav-link"><i class="fa-solid fa-film"></i> Film</a></li>
        <li><a href="/search.html?type=2" class="nav-link"><i class="fa-solid fa-tv"></i> Series</a></li>
        <li><a href="/#watchlist" class="nav-link"><i class="fa-solid fa-bookmark"></i> Watchlist</a></li>
      </ul>
    </div>

    <div class="nav-right">
      <div class="search-box">
        <i class="fa-solid fa-magnifying-glass search-icon"></i>
        <input type="text" id="navSearchInput" placeholder="Cari film, series... [/]" />
      </div>

      <a href="/#watchlist" class="watchlist-btn-badge" title="Daftar Tontonan">
        <i class="fa-solid fa-bookmark"></i>
        <span class="badge-count" style="display: none;">0</span>
      </a>

      <button class="menu-toggle" id="menuToggleBtn" aria-label="Toggle Menu">
        <i class="fa-solid fa-bars"></i>
      </button>
    </div>
  </header>

  <!-- Detail Backdrop Header -->
  <section class="detail-header-backdrop" id="detailBackdrop">
    <div class="detail-backdrop-overlay"></div>
    
    <div class="detail-content-wrap">
      <!-- Left: Poster Card & CTA -->
      <div class="detail-poster-col">
        <div class="detail-poster-card">
          <img id="detailPosterImg" src="" alt="Poster" />
          <div class="detail-poster-actions">
            <button class="btn btn-primary" id="detailPlayNowBtn" style="width: 100%;">
              <i class="fa-solid fa-play"></i> Putar Sekarang
            </button>
            <button class="btn btn-secondary" id="detailWatchlistBtn" style="width: 100%;">
              <i class="fa-solid fa-plus"></i> Watchlist
            </button>
            <button class="btn btn-secondary" id="detailTrailerBtn" style="width: 100%; display: none;">
              <i class="fa-solid fa-film"></i> Tonton Trailer
            </button>
          </div>
        </div>
      </div>

      <!-- Right: Metadata & Synopsis -->
      <div class="detail-info-col">
        <div class="hero-badge-row">
          <span class="badge" id="detailTypeBadge">Movie</span>
          <span class="badge badge-rating">
            <i class="fa-solid fa-star"></i>
            <span id="detailRating">0.0</span>
            <span id="detailRatingCount" style="font-weight: normal; opacity: 0.8; font-size: 0.65rem;"></span>
          </span>
          <span class="badge badge-quality" id="detailQualityBadge">HD 1080p</span>
          <span class="badge badge-meta" id="detailYear"></span>
          <span class="badge badge-meta" id="detailDuration"></span>
          <span class="badge badge-meta" id="detailCountry"></span>
        </div>

        <h1 class="detail-title" id="detailTitle">Memuat Detail...</h1>

        <div class="hero-genres" id="detailGenres">
          <!-- Chips -->
        </div>

        <div>
          <h3 class="detail-synopsis-title">Sinopsis</h3>
          <p class="detail-synopsis-text" id="detailSynopsis">
            Memuat sinopsis dan informasi selengkapnya...
          </p>
        </div>

        <!-- Dubbing Options (if available) -->
        <div class="detail-dubs-box" id="detailDubsBox" style="display: none;">
          <div class="dubs-title"><i class="fa-solid fa-language"></i> Audio / Dubbing Tersedia:</div>
          <div class="dubs-list" id="detailDubsList"></div>
        </div>

        <!-- Subtitles available info -->
        <div id="detailSubtitlesBox" style="font-size: 0.8rem; color: var(--text-muted); display: none;">
          <i class="fa-solid fa-closed-captioning"></i> Subtitle: <span id="detailSubtitlesList" class="text-slate-300"></span>
        </div>
      </div>
    </div>
  </section>

  <!-- Seasons & Episodes Section (Only shown for Series) -->
  <section class="seasons-section" id="seriesEpisodesSection" style="display: none;">
    <div class="section-header">
      <div class="section-title-wrap">
        <div class="section-title-bar"></div>
        <h2 class="section-title">Daftar Episode</h2>
      </div>
    </div>

    <!-- Season Tabs -->
    <div class="season-tabs" id="seasonTabs">
      <!-- Injected by detail.js -->
    </div>

    <!-- Episode Grid -->
    <div class="episodes-grid" id="episodesGrid">
      <!-- Injected by detail.js -->
    </div>
  </section>

  <!-- Trailer Modal -->
  <div id="trailerModal" style="display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 500; align-items: center; justify-content: center; padding: 1.5rem;">
    <div style="position: relative; width: 100%; max-width: 900px; background: #121218; border-radius: 16px; overflow: hidden; border: 1px solid var(--border-subtle); box-shadow: 0 25px 60px rgba(0,0,0,0.9);">
      <div style="display: flex; align-items: center; justify-content: space-between; padding: 1rem 1.5rem; border-bottom: 1px solid var(--border-subtle);">
        <h4 id="trailerModalTitle" style="font-size: 1rem; font-weight: 700; color: #fff;">Trailer Resmi</h4>
        <button id="trailerCloseBtn" style="background: none; border: none; color: var(--text-secondary); font-size: 1.25rem; cursor: pointer;">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>
      <div style="position: relative; width: 100%; aspect-ratio: 16/9; background: #000;">
        <video id="trailerVideo" controls style="width: 100%; height: 100%; object-fit: contain;"></video>
      </div>
    </div>
  </div>

  <!-- Footer -->
  <footer class="footer">
    <div class="footer-inner">
      <div class="footer-top">
        <div class="brand-logo" style="font-size: 1.15rem;">
          <div class="logo-icon" style="width: 28px; height: 28px; font-size: 0.8rem;">
            <i class="fa-solid fa-play"></i>
          </div>
          <span>Movie<span class="logo-tag">Nas</span></span>
        </div>
      </div>
      <div class="footer-bottom">
        <p>© 2026 MovieNas. Nonton film &amp; series terbaik kapan saja.</p>
      </div>
    </div>
  </footer>

  <script src="/js/app.js"></script>
  <script src="/js/detail.js"></script>
</body>
</html>
