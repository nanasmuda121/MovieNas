<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Streaming Pemutar Video — MovieNas</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍿</text></svg>" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body style="background-color: #06060a;">

  <!-- Minimalistic Top Navigation for Player -->
  <header class="navbar scrolled">
    <div class="nav-left">
      <a href="/" class="brand-logo">
        <div class="logo-icon">
          <i class="fa-solid fa-play"></i>
        </div>
        <span>Movie<span class="logo-tag">Nas</span></span>
      </a>

      <a id="playerBackBtn" href="/" class="player-back-btn">
        <i class="fa-solid fa-arrow-left"></i>
        <span id="playerBackText">Kembali</span>
      </a>
    </div>

    <div class="player-title-info">
      <h2 class="player-main-title" id="playerTitle">Memuat Streaming...</h2>
      <p class="player-sub-title" id="playerSubTitle"></p>
    </div>

    <div class="nav-right">
      <button class="btn btn-secondary" id="playerWatchlistBtn" style="padding: 0.45rem 0.9rem; font-size: 0.8rem;">
        <i class="fa-solid fa-bookmark"></i> Watchlist
      </button>
    </div>
  </header>

  <!-- Player Page Container -->
  <main class="player-page-container">

    <!-- Video Player Element & Custom Controls -->
    <div class="video-wrapper" id="videoWrapper">
      <!-- HTML5 Video element -->
      <video
        id="mainVideo"
        class="video-element"
        playsinline
        preload="metadata"
        crossOrigin="anonymous"
      ></video>

      <!-- Center Big Play Button Overlay -->
      <div class="player-center-play-btn" id="centerPlayBtn" title="Putar Video">
        <i class="fa-solid fa-play"></i>
      </div>

      <!-- Loading Spinner -->
      <div class="player-loading-spinner" id="playerSpinner"></div>

      <!-- Custom Control Bar -->
      <div class="player-controls-bar" id="controlsBar">
        <!-- Seek / Progress Bar -->
        <div class="progress-container" id="progressContainer">
          <div class="progress-buffer-bar" id="progressBuffer"></div>
          <div class="progress-filled-bar" id="progressFilled"></div>
          <div class="progress-thumb" id="progressThumb"></div>
        </div>

        <!-- Controls Row -->
        <div class="controls-row">
          <!-- Left Controls -->
          <div class="controls-group-left">
            <button class="ctrl-btn" id="playPauseBtn" title="Play / Pause (Spasi)">
              <i class="fa-solid fa-play"></i>
            </button>

            <button class="ctrl-btn" id="rewindBtn" title="Mundur 10 Detik (←)">
              <i class="fa-solid fa-rotate-left"></i>
            </button>

            <button class="ctrl-btn" id="forwardBtn" title="Maju 10 Detik (→)">
              <i class="fa-solid fa-rotate-right"></i>
            </button>

            <div class="volume-wrapper">
              <button class="ctrl-btn" id="volumeBtn" title="Mute / Unmute (M)">
                <i class="fa-solid fa-volume-high"></i>
              </button>
              <input type="range" id="volumeSlider" class="volume-slider" min="0" max="1" step="0.05" value="1" />
            </div>

            <div class="time-display">
              <span id="currentTime">00:00</span> / <span id="durationTime">00:00</span>
            </div>
          </div>

          <!-- Right Controls -->
          <div class="controls-group-right">
            <!-- Playback Speed Selector -->
            <div class="player-select-wrap">
              <button class="player-select-btn" id="speedBtn" title="Kecepatan Putar">
                <span id="speedLabel">1x</span>
                <i class="fa-solid fa-chevron-up" style="font-size: 0.65rem;"></i>
              </button>
              <div class="player-dropdown-menu" id="speedDropdown">
                <div class="dropdown-item" data-speed="0.5">0.5x</div>
                <div class="dropdown-item" data-speed="0.75">0.75x</div>
                <div class="dropdown-item active" data-speed="1">1.0x (Normal)</div>
                <div class="dropdown-item" data-speed="1.25">1.25x</div>
                <div class="dropdown-item" data-speed="1.5">1.5x</div>
                <div class="dropdown-item" data-speed="2">2.0x</div>
              </div>
            </div>

            <!-- Subtitle Track Selector -->
            <div class="player-select-wrap">
              <button class="player-select-btn" id="subBtn" title="Subtitle / Takarir">
                <i class="fa-solid fa-closed-captioning"></i>
                <span id="subLabel">Sub: Nonaktif</span>
                <i class="fa-solid fa-chevron-up" style="font-size: 0.65rem;"></i>
              </button>
              <div class="player-dropdown-menu" id="subDropdown">
                <div class="dropdown-item active" data-sub="off">Matikan Subtitle</div>
                <!-- Dynamic subtitles injected by player.js -->
              </div>
            </div>

            <!-- Resolution / Quality Selector -->
            <div class="player-select-wrap">
              <button class="player-select-btn" id="qualityBtn" title="Kualitas Video">
                <i class="fa-solid fa-gear"></i>
                <span id="qualityLabel">Kualitas</span>
                <i class="fa-solid fa-chevron-up" style="font-size: 0.65rem;"></i>
              </button>
              <div class="player-dropdown-menu" id="qualityDropdown">
                <!-- Dynamic qualities injected by player.js -->
              </div>
            </div>

            <!-- Fullscreen Button -->
            <button class="ctrl-btn" id="fullscreenBtn" title="Layar Penuh (F)">
              <i class="fa-solid fa-expand"></i>
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- Below Player Section (Episode Navigation, Details) -->
    <div class="player-below-section">
      <!-- Series Episode Navigation Bar -->
      <div class="series-navigation-bar" id="seriesNavBar" style="display: none;">
        <div>
          <h4 class="text-sm font-bold text-white mb-1" id="seriesSeasonTitle">Daftar Episode</h4>
          <p class="text-xs text-slate-400">Klik nomor episode di bawah untuk berganti tontonan langsung</p>
        </div>

        <div style="display: flex; gap: 0.75rem;">
          <button class="btn btn-secondary" id="prevEpBtn" style="padding: 0.5rem 1rem; font-size: 0.8rem; display: none;">
            <i class="fa-solid fa-chevron-left"></i> Episode Sebelumnya
          </button>
          <button class="btn btn-primary" id="nextEpBtn" style="padding: 0.5rem 1rem; font-size: 0.8rem; display: none;">
            Episode Selanjutnya <i class="fa-solid fa-chevron-right"></i>
          </button>
        </div>
      </div>

      <!-- Quick Horizontal Episodes List -->
      <div class="series-episodes-list-horizontal" id="quickEpList" style="display: none;">
        <!-- Injected by player.js -->
      </div>
    </div>

  </main>

  <script src="/js/app.js"></script>
  <script src="/js/player.js"></script>
</body>
</html>
